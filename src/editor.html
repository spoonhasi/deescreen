<!doctype html>
<meta charset="utf-8">
<title>deescreen · editor</title>
<link rel="icon" href="/favicon.ico" type="image/png">
<style>
  :root {
    --bg: #14171c; --panel: #1c2027; --line: #2c323c; --fg: #e6e9ef; --dim: #98a1b0;
    --target: #00c8ff; --danger: #ff3c3c; --region: #ffd200; --ok: #38d39f;
    --header-h: 49px; --footer-h: 128px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
         font: 13px/1.5 "Segoe UI", system-ui, sans-serif; }

  /* The height is fixed, so wrapping must not be allowed — anything that overflows is
     clipped away. The window title shrinks to make room instead. */
  header { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; height: var(--header-h);
           padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0 12px 0 0; font-weight: 600; white-space: nowrap; }
  header > button, header > input { flex: none; }
  #winmeta { color: var(--dim); font-size: 12px; margin-right: auto;
             min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  button, input, select, textarea {
    background: #262c35; color: var(--fg); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 9px; font: inherit; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: #48505d; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #14506b; border-color: #1d6f92; }
  button.danger { background: #6b1a1a; border-color: #922323; }
  button.on { background: #14506b; border-color: var(--target); }

  main { display: flex; height: calc(100vh - var(--header-h)); }

  /* Left: the capture (flexible) plus the edit footer (fixed). Putting the footer here
     lets it use the full width, so the fields do not have to stack, and the sidebar does
     not jump around as the selection changes. */
  #left { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #stagewrap { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
  #stage { position: relative; display: inline-block; line-height: 0; }
  #shot { display: block; image-rendering: pixelated; }
  /* With no capture, leaving the <img> in place makes the browser draw a broken-image
     icon. Clearing src is not enough, so the element is hidden and guidance shown. */
  #stage.empty #shot, #stage.empty #ov { display: none; }
  #nocap { display: none; max-width: 560px; padding: 20px 22px; border-radius: 8px;
           border: 1px dashed var(--line); background: #1a1e25; line-height: 1.7; }
  #stage.empty #nocap { display: block; }
  #nocap h3 { margin: 0 0 8px; font-size: 14px; }
  #nocap ol { margin: 8px 0 0; padding-left: 20px; color: var(--dim); }
  #nocap b { color: var(--fg); }
  /* Pin left/top only. With inset:0 the right/bottom values fight the width JS sets, and
     the canvas display size can drift out of step with its backing store. */
  #ov { position: absolute; left: 0; top: 0; cursor: crosshair; }

  /* The edit footer — always the same height. A button and a region need different
     numbers of fields, so hiding uses visibility, not display, to keep the layout still. */
  #footer { flex: none; height: var(--footer-h); border-top: 1px solid var(--line);
            background: var(--panel); padding: 8px 12px; overflow-x: auto; }
  #footer .title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
                   color: var(--dim); margin-bottom: 6px; }
  #selhint { text-transform: none; letter-spacing: 0; }
  /* Two rows — cramming the note onto one row produces a horizontal scrollbar. Short
     fields on the first row, the note taking the full width on the second. */
  .frow { display: flex; gap: 14px; align-items: center; flex-wrap: nowrap; }
  .frow + .frow { margin-top: 6px; }
  .frow .f { display: flex; gap: 5px; align-items: center; flex: none; }
  .frow .f > span { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .frow input[type=number] { width: 68px; }
  #f_name { width: 150px; }
  #noteRow .f { flex: 1; }
  #f_note { flex: 1; min-width: 0; }
  #noteRow.off { visibility: hidden; }
  #form.empty { opacity: .3; pointer-events: none; }
  #targetOnly { display: flex; gap: 14px; align-items: center; }
  #targetOnly.off { visibility: hidden; }

  /* Right: the top is fixed; only the list scrolls on its own */
  aside { width: 340px; flex: none; border-left: 1px solid var(--line);
          background: var(--panel); display: flex; flex-direction: column; }
  #panels { flex: none; padding: 10px 10px 0; }
  #listwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 10px 10px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--dim); margin: 14px 0 6px; }
  #panels h2:first-child { margin-top: 0; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row label { width: 78px; flex: none; color: var(--dim); font-size: 12px; }
  .row input[type=text], .row input[type=number], .row select, .row textarea { flex: 1; min-width: 0; }

  ul#list { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow-y: auto;
            border: 1px solid var(--line); border-radius: 4px; }
  ul#list li { display: flex; gap: 6px; align-items: center; padding: 5px 6px;
               border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
  ul#list li:hover { background: #232833; }
  /* The selection has to stand out in the list too — whichever of the picture and the
     list you are looking at, it must be obvious the same item is selected. A thick left
     bar reads far more strongly than a background colour. */
  ul#list li.sel { background: #14435c; border-color: var(--target);
                   border-left: 4px solid var(--target); padding-left: 3px;
                   box-shadow: 0 0 0 1px var(--target) inset; }
  ul#list li.sel .nm { font-weight: 700; color: #fff; }
  ul#list li.sel .xy { color: #cfe8f5; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xy { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .hint { color: var(--dim); font-size: 11.5px; margin: 6px 0 0; }
  kbd { background: #2b323d; border: 1px solid var(--line); border-radius: 3px;
        padding: 0 4px; font-size: 11px; }

  /* Message modal — inside the sidebar it would push everything below it down each
     time it appeared. Float it above instead. */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
           align-items: center; justify-content: center; z-index: 100; }
  #modal.on { display: flex; }
  #modalbox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
              max-width: min(680px, 90vw); max-height: 80vh; overflow: auto;
              padding: 16px 18px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  #msg { white-space: pre-wrap; word-break: break-word; font-size: 13px; margin: 0 0 12px; }
  #msg.err { color: #ff9a9a; }
  #msg.ok { color: var(--ok); }
  #modalbox .foot { display: flex; justify-content: flex-end; }

  /* With no profiles at all, the only thing that can be done is [＋ Profile]. Leaving the
     rest clickable produces "I pressed save and nothing happened". Greyed out, where to
     click is the one thing left visible. */
  body.noprof #panels, body.noprof #listwrap, body.noprof #footer,
  body.noprof header button:not(#newprof), body.noprof #profpick, body.noprof #code {
    opacity: .35; pointer-events: none;
  }
  /* Language switch — a segmented pill. The active side is filled so which one is on is
     readable at a glance, without a second colour to learn. */
  #lang { display: flex; flex: none; border: 1px solid var(--line); border-radius: 6px;
          overflow: hidden; background: #262c35; }
  #lang button { border: 0; border-radius: 0; padding: 4px 10px; background: transparent;
                 color: var(--dim); font-size: 12px; line-height: 1.4; }
  #lang button:hover:not(.on) { color: var(--fg); background: #2e3540; }
  #lang button.on { background: #0f1216; color: #fff; font-weight: 600; }
</style>

<header>
  <h1 data-i18n="app">deescreen editor</h1>
  <button id="newprof" data-i18n="newprof" data-i18n-title="newprof.t">＋ Profile</button>
  <select id="profpick" data-i18n-title="profpick.t"></select>
  <button id="renprof" data-i18n="renprof" data-i18n-title="renprof.t">Rename</button>
  <button id="delprof" class="danger" data-i18n="delprof" data-i18n-title="delprof.t">Delete profile</button>
  <span id="winmeta" data-i18n="loading">loading…</span>
  <button id="restore" data-i18n="restore">Restore window</button>
  <button id="refresh" data-i18n="refresh">Refresh capture</button>
  <button id="detect" data-i18n="detect">Detect controls</button>
  <button id="export" data-i18n="export">Export</button>
  <input id="code" type="password" size="12" autocomplete="off"
         data-i18n-ph="code.ph" data-i18n-title="code.t">
  <button id="save" class="primary" data-i18n="save">Save</button>
  <div id="lang">
    <button data-lang="ko">한국어</button><button data-lang="en">English</button>
  </div>
</header>

<main>
  <div id="left">
    <div id="stagewrap">
      <div id="stage" class="empty">
        <img id="shot" alt=""><canvas id="ov"></canvas>
        <div id="nocap"></div>
      </div>
    </div>

    <div id="footer">
      <div class="title" data-i18n="selected">Selected <span id="selhint"></span></div>
      <div id="form" class="empty">
        <div class="frow">
          <div class="f"><span data-i18n="f.name">Name</span><input id="f_name" type="text"></div>
          <div class="f"><span data-i18n="f.kind">Kind</span>
            <select id="f_kind">
              <option value="target" data-i18n="kind.button">Button (pressed)</option>
              <option value="region" data-i18n="kind.region">Region (captured)</option>
            </select>
          </div>
          <div class="f"><span>x, y</span>
            <input id="f_x" type="number"><input id="f_y" type="number"></div>
          <div class="f"><span>w, h</span>
            <input id="f_w" type="number"><input id="f_h" type="number"></div>
          <div id="targetOnly" class="off">
            <div class="f"><span data-i18n="f.mouse">Mouse</span>
              <select id="f_button"><option>left</option><option>right</option><option>middle</option></select>
              <label style="display:flex;gap:4px;align-items:center;color:var(--dim)">
                <input id="f_double" type="checkbox"><span data-i18n="f.double">double</span></label>
            </div>
            <div class="f">
              <label style="display:flex;gap:4px;align-items:center;color:var(--dim)"
                     data-i18n-title="f.confirm.t">
                <input id="f_confirm" type="checkbox"><span data-i18n="f.confirm">confirm</span></label>
            </div>
            <div class="f"><span data-i18n="f.settle">Settle ms</span>
              <input id="f_settle" type="number" data-i18n-ph="f.settle.ph"></div>
            <div class="f"><button id="testClick" data-i18n="tryit">Try it</button></div>
          </div>
        </div>
        <div class="frow off" id="noteRow">
          <div class="f"><span data-i18n="f.note">Note</span>
            <input id="f_note" type="text" data-i18n-ph="f.note.ph"></div>
        </div>
      </div>
    </div>
  </div>

  <aside>
    <div id="panels">
      <h2 data-i18n="h.window">Target window</h2>
      <div class="row"><label data-i18n="l.desc">Description</label>
        <input id="p_desc" type="text" data-i18n-title="l.desc.t" data-i18n-ph="l.desc.ph"></div>
      <div class="row"><label data-i18n="l.programs">Programs</label>
        <select id="winpick" data-i18n-title="l.programs.t"></select></div>
      <div class="row"><label data-i18n="l.title">Title</label>
        <input id="w_title" type="text" data-i18n-ph="l.title.ph" data-i18n-title="l.title.t"></div>
      <div class="row"><label data-i18n="l.class">Class</label>
        <input id="w_class" type="text" data-i18n-ph="l.class.ph" data-i18n-title="l.class.t"></div>
      <div class="row">
        <label data-i18n="l.exact">Exact</label><input id="w_exact" type="checkbox" style="flex:none">
        <span class="hint" style="margin:0" data-i18n="l.exact.hint">the whole title must match</span>
      </div>
      <p id="winmatch" class="hint"></p>
      <p class="hint" data-i18n-html="hint.match"></p>

      <h2 data-i18n="h.ref">Reference size</h2>
      <div class="row">
        <span id="refmeta" class="xy">—</span>
        <button id="setref" style="margin-left:auto" data-i18n="fitref">Fit to current window</button>
      </div>

      <h2 data-i18n="h.tools">Tools</h2>
      <div class="row">
        <button id="addTarget" data-i18n="addbtn">＋ Button</button>
        <button id="addRegion" data-i18n="addregion">＋ Region</button>
        <button id="del" class="danger" disabled data-i18n="del">Delete</button>
        <button id="delall" class="danger" data-i18n="delall">Delete all</button>
      </div>
      <p class="hint" data-i18n-html="hint.draw"></p>
      <p class="hint" data-i18n-html="hint.kinds"></p>
    </div>

    <div id="listwrap">
      <h2><span data-i18n="h.list">List</span> <span id="listcount" class="xy"></span></h2>
      <ul id="list"></ul>
    </div>
  </aside>
</main>

<div id="modal">
  <div id="modalbox">
    <p id="msg"></p>
    <div class="foot"><button id="modalclose" class="primary" data-i18n="close">Close</button></div>
  </div>
</div>

const LANG_KEY = 'deescreen.lang';
// First visit follows the browser; after that the choice is remembered per browser. Wrapped
// because storage throws outright in some privacy modes, and a dead editor over a language
// preference would be absurd.
let lang = (() => {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && STRINGS[saved]) return saved;
  } catch (_) {}
  return (navigator.language || 'en').toLowerCase().startsWith('ko') ? 'ko' : 'en';
})();

/// Look up a string and fill its `{0}`-style placeholders. An unknown key returns the key
/// itself rather than blank — a missing translation should be visible, not invisible.
function t(key, ...args) {
  const table = STRINGS[lang] || STRINGS.en;
  let out = table[key] ?? STRINGS.en[key] ?? key;
  args.forEach((v, i) => { out = out.split('{' + i + '}').join(String(v)); });
  return out;
}

/// `t()` for a count. `{0}` is the count; a `key.one` variant is preferred when it is exactly 1.
///
/// English needs "1 region" and "2 regions"; Korean does not inflect for number at all. So the
/// singular is an optional extra key rather than a rule baked into the lookup — a language that
/// does not need one simply does not define it, and nothing here has to know which is which.
function tn(key, n, ...rest) {
  const table = STRINGS[lang] || STRINGS.en;
  const one = key + '.one';
  return t(n === 1 && (one in table) ? one : key, n, ...rest);
}

// The stage panel is rebuilt rather than translated in place, so switching language while one
// is showing does not leave half a sentence behind.
let lastStage = null;
function stagePanel(key, ...args) {
  lastStage = [key, args];
  showStage(false, t(key, ...args));
}

// The tab is the only place a profile name can be seen without switching to the window, and
// with several open it is the only thing telling them apart. Falls back to the plain name when
// no profile is loaded, which is also when there is nothing to distinguish.
function renderTitle() {
  document.title = `deescreen · ${profile || t('app.tab')}`;
}

function applyLang() {
  document.documentElement.lang = lang;
  renderTitle();
  for (const el of document.querySelectorAll('[data-i18n]')) {
    // Only the element's own text — a child <span> carrying its own key must survive.
    const own = [...el.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
    if (own) own.textContent = t(el.dataset.i18n);
    else if (!el.children.length) el.textContent = t(el.dataset.i18n);
  }
  for (const el of document.querySelectorAll('[data-i18n-html]')) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll('[data-i18n-title]')) el.title = t(el.dataset.i18nTitle);
  for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = t(el.dataset.i18nPh);
  for (const b of document.querySelectorAll('#lang button')) b.classList.toggle('on', b.dataset.lang === lang);

  // Anything rendered from data has to be redrawn — translating the DOM in place would leave
  // the parts JS wrote untouched.
  if (typeof renderAdminHint === 'function') {
    renderAdminHint();
    renderWindowPicker();
    renderWindowMatch();
    renderRef();
    renderList();
    select(sel);
    if (lastStage) showStage(false, t(lastStage[0], ...lastStage[1]));
  }
}

function setLang(next) {

let sel = -1;
let client = [0, 0];     // the target window's client size
// The profile being edited. ?profile= in the URL is honoured, so a link can open a
// particular window directly.
let profile = new URLSearchParams(location.search).get('profile') || '';
let profiles = [];
const pq = () => (profile ? '&profile=' + encodeURIComponent(profile) : '');
let adminRequired = false; // whether the server demands an admin code (never its value)
let windowList = [];      // GET /windows (the picker list, and counting matches)

// worth knowing about the thing being warned over.

// With no capture, show what to do about it in that spot. A lone broken-image icon gives
// a first-time visitor no way to tell "broken" from "not set up yet".
function showStage(ok, html) {
  const stage = $('#stage');
  stage.classList.toggle('empty', !ok);
  if (ok) lastStage = null;
  else $('#nocap').innerHTML = html || '';
}

let msgTimer = null;

// Messages go in a modal. While they lived in the sidebar, every message pushed the rest
// down and the scroll jumped. Making people dismiss success notices too would be a
// nuisance, so only those fade by themselves — errors stay until read and closed.
function say(text, kind) {
  const overlay = $('#modal');
  clearTimeout(msgTimer);
  if (!text) { overlay.classList.remove('on'); return; }
  const body = $('#msg');
  body.textContent = text;
  body.className = kind || '';
  overlay.classList.add('on');
  if (kind === 'ok') msgTimer = setTimeout(() => overlay.classList.remove('on'), 2500);
}

function closeMsg() { clearTimeout(msgTimer); $('#modal').classList.remove('on'); }

// ── loading ──────────────────────────────────────────────────────────
// On a failed response, take **the reason the server wrote**. This used to ignore res.ok,
// so instead of "the target window is minimized" you got some unrelated TypeError — the
// sentence explaining the cause was already in the response and was being thrown away.
async function getJson(url) {
  const res = await fetch(url);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(body.error || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return body;
}

async function loadAll() {
  // Two stages. The button definitions load **independently of the window**, so the list
  // and the window fields must be drawn even when no window is found — a missing window is
  // exactly when someone comes in to fix those fields. This used to let the window lookup
  // throw first, leaving the editor blank, which left no way to fix anything.
  try {
    // The whole definition comes from one endpoint — window spec, reference size,
    // buttons, regions and keys are a single document.
    let all;
    try {
      all = await getJson('/profiles' + (profile ? '?profile=' + encodeURIComponent(profile) : ''));
    } catch (e) {
      // ?profile= in the address bar is **the profile you were last looking at**
      // (switchProfile writes it there). If it was deleted or renamed this 404s, and
      // showing that raw would wall off the whole editor — you could not even get in to
      // create a new one. Drop the filter and ask again.
      if (!profile) throw e;
      profile = '';
      const u = new URL(location.href);
      u.searchParams.delete('profile');
      history.replaceState(null, '', u);
      all = await getJson('/profiles');
    }
    profiles = Object.keys(all.profiles);
    adminRequired = !!(all.policy && all.policy.admin_code_required);
    renderAdminHint();
    document.body.classList.toggle('noprof', profiles.length === 0);

    // No profiles at all = a fresh install. That is not a fault, so do not greet it with a
    // red error; just say in the middle of the screen that this is where you make one.
    // Everything below assumes one profile exists, so stop here.
    if (profiles.length === 0) { noProfiles(); return; }

    // There may be no default (two or more profiles and config picked none). Opening any
    // of them is harmless in the editor, so open the first — unlike the control API,
    // opening one does not touch the window.
    profile = all.profile || all.default_profile || profiles[0];
    if (!all.profiles[profile]) profile = profiles[0];
    // With ?profile= only that one comes back, so fetch the list once more to fill the picker.
    if (profiles.length === 1 && profiles[0] === profile) {
      try { profiles = Object.keys((await getJson('/profiles')).profiles); } catch (_) {}
    }
    renderProfiles(all.default_profile);
    renderTitle();
    doc = toDoc(all.profiles[profile]);
    $('#p_desc').value = doc.description || '';
    windowChanged = false;
    rebuildItems();
  } catch (e) {
    // Getting here means the server cannot even hand over the list. Leaving the header on
    // "loading…" makes it look like it is **still waiting**, and you stare at a stopped
    // screen forever. Say that it finished, and why.
    $('#winmeta').textContent = t('winmeta.loadfail');
    $('#profpick').innerHTML = `<option>${escapeHtml(t('opt.none'))}</option>`;
    document.body.classList.add('noprof');
    shot.removeAttribute('src');
    stagePanel('stage.loadfail', escapeHtml(e.message));
    say('', '');
    return;
  }

  try {
    windowList = (await getJson('/windows')).windows;
  } catch (_) {
    windowList = [];
  }
  renderWindowPicker();
  renderWindowMatch();

  try {
    const w = await getJson('/window?x=1' + pq());
    client = w.window.client;
    // The list was coloured before this was known, and out-of-bounds is decided against it.
    // Draw it again now that the answer exists.
    renderList();
    $('#winmeta').textContent =
      t('winmeta.ok', w.window.title, client[0], client[1], w.window.dpi) +
      (w.size_mismatch ? t('winmeta.mismatch') : '');
    renderRef();
    // No showStage(true) here. refreshShot() raises the stage itself when the capture works,
    // and when it fails it puts the reason on the stage — calling it again unconditionally
    // wiped that reason and left an empty screen explaining nothing.
    anchorProblem = w.anchor_unresolved || null;
    await refreshShot();
    if (anchorProblem) {
      // The screenshot is real; the rectangles are not placeable on it. Say so rather than
      // drawing them somewhere plausible.
      say(t('err.anchor', anchorProblem.error || ''), 'err');
    } else if (w.size_mismatch) {
      say(t('err.sizemismatch', w.size_mismatch), 'err');
    } else {

    }
  } catch (e) {
    // Editing continues without a window — the list, the window fields and the coordinate
    // boxes are all already live.
    client = [0, 0];
    anchorProblem = null;
    shot.removeAttribute('src');
    $('#winmeta').textContent = t('winmeta.notfound');
    renderRef();

    if (/minimi[sz]ed/i.test(e.message)) {
      stagePanel('stage.minimised');
      say('', '');
    } else if (!items.length && !windowList.some(w => matchesSpec(w, (doc && doc.window) || {}))) {
      // A freshly created profile. Showing some arbitrary window here would have you
      // **drawing rectangles on the wrong program's screen** — the coordinates would
      // belong to an entirely different window, so black is better. Picking one shows it
      // immediately.
      stagePanel('stage.pick');
      say('', '');
    } else {
      stagePanel('stage.notfound', escapeHtml(e.message));
      say('', '');
    }

}

// The screen for having no profiles at all. There is nothing to look up or capture, so
// neither is attempted.
function noProfiles() {
  profile = '';
  doc = null;
  items = [];
  sel = -1;
  client = [0, 0];
  windowList = [];
  shot.removeAttribute('src');
  $('#winmeta').textContent = t('winmeta.noprof');
  $('#profpick').innerHTML = `<option>${escapeHtml(t('opt.none'))}</option>`;
  $('#list').innerHTML = '';
  renderTitle();
  stagePanel('stage.noprofiles');
  say('', '');

// Undoes both minimised and covered in one go. This is the recovery needed most often in
// the editor, so it gets a button.
async function restoreWindow() {
  try {
    const r = await fetch('/window/focus?x=1' + pq(), { method: 'POST' });
    const b = await r.json().catch(() => ({}));
    if (!r.ok) { say(t('err.restore', b.error || r.status), 'err'); return; }
    await loadAll();
  } catch (e) { say(t('err.restore', e), 'err'); }

// Turn one profile view from `/profiles` (arrays) back into the saved document shape.
function toDoc(t) {
  const d = {
    description: t.description || '',
    window: t.window,
    reference_client: t.reference_client,
    on_size_mismatch: t.on_size_mismatch,
    regions: {}, buttons: {}, keys: {}
  };
  // A region is an object now, not a bare rectangle. Keep the fields this editor has no
  // control for — dropping an anchor somebody set is not an edit anyone asked for.
  for (const r of t.regions) {
    const o = { rect: r.rect };
    if (r.anchor) o.anchor = r.anchor;
    if (r.note) o.note = r.note;
    d.regions[r.name] = o;
  }
  for (const g of t.buttons) {
    const o = { rect: g.rect };
    if (g.point) o.point = g.point;
    if (g.click_button && g.click_button !== 'left') o.click_button = g.click_button;
    if (g.double) o.double = true;
    if (g.confirm) o.confirm = true;
    if (g.settle_ms != null) o.settle_ms = g.settle_ms;
    if (g.hold_ms != null) o.hold_ms = g.hold_ms;
    if (g.anchor) o.anchor = g.anchor;
    if (g.note) o.note = g.note;
    d.buttons[g.name] = o;
  }
  for (const k of t.keys) d.keys[k.name] = k.keys;
  return d;
}

  items = [];

    items.push({ kind: 'region', name, ...structuredClone(r), rect: [...r.rect] });

  for (const [name, b] of Object.entries(doc.buttons)) items.push({ kind: 'target', name, ...structuredClone(b) });

  const d = structuredClone(doc);
  d.regions = {}; d.buttons = {};

    if (it.kind === 'region') {
      const r = { rect: it.rect };
      if (it.anchor) r.anchor = it.anchor;
      if (it.note) r.note = it.note;
      d.regions[it.name] = r;
      continue;
    }
    const o = { rect: it.rect };
    if (it.point) o.point = it.point;
    if (it.click_button && it.click_button !== 'left') o.click_button = it.click_button;
    if (it.double) o.double = true;
    if (it.confirm) o.confirm = true;
    if (it.settle_ms != null && it.settle_ms !== '') o.settle_ms = Number(it.settle_ms);
    if (it.hold_ms != null && it.hold_ms !== '') o.hold_ms = Number(it.hold_ms);
    if (it.anchor) o.anchor = it.anchor;
    if (it.note) o.note = it.note;
    d.buttons[it.name] = o;
  }

}

let shotUrl = null;       // from createObjectURL — must be revoked when replaced
let winPreviewTimer = null;

// Capture using an **unsaved window spec**.
//
// GET /capture.png captures the window of the profile as saved on disk. So picking a
// different program from [Programs] kept showing the old window until you saved, and a
// freshly created profile showed whatever window had been seeded into it — which means
// drawing rectangles on the wrong program's screen, and coordinates belonging to an
// entirely different window. That is the worst kind of silent misbehaviour here.
//
// POST /preview.png finds the window from the candidate document in the body, so it

// draws the rectangles itself.

    r = await fetch('/preview.png?save=false&buttons=0' + pq(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(toDocFromItems())

  } catch (e) {
    stagePanel('stage.capwinfail', escapeHtml(String(e)));
    return false;
  }
  if (!r.ok) {
    let why = 'HTTP ' + r.status;
    try { why = (await r.json()).error || why; } catch (_) {}
    shot.removeAttribute('src');
    stagePanel('stage.capwinfail', escapeHtml(why));
    return false;
  }
  const url = URL.createObjectURL(await r.blob());
  const ok = await new Promise(res => {
    shot.onload = () => res(true); shot.onerror = () => res(false); shot.src = url;
  });

  if (!ok) { URL.revokeObjectURL(url); shotUrl = null; return false; }
  shotUrl = url;
  showStage(true);
  fitView();
  return true;

// Adopt the chosen window as the editor's coordinate universe — the picture and the
// client size have to move together.
async function applyWindowChoice(w) {
  const before = client;
  client = w.client;
  $('#winmeta').textContent = t('winmeta.unsaved', w.title, client[0], client[1]);
  if (!(await previewShot())) { client = before; return; }
  renderRef();
  // Rectangles already drawn are relative to the **old window**. Swapping the window moves
  // where every one of them points, so this does not pass silently.
  if (items.length && before[0] && (before[0] !== client[0] || before[1] !== client[1])) {
    say(tn('err.winchanged', items.length, before[0], before[1], client[0], client[1]), 'err');
  }

// While the title or class is being typed, do not capture on every keystroke. Capture only
// when exactly one window matches — zero means there is nothing to capture, and several
// means the server would refuse to act anyway.
function scheduleWindowPreview() {
  clearTimeout(winPreviewTimer);
  winPreviewTimer = setTimeout(() => {
    if (!doc) return;
    const hits = windowList.filter(w => matchesSpec(w, doc.window || {}));
    if (hits.length === 1) applyWindowChoice(hits[0]);
  }, 400);
}

async function refreshShot() {
  // Always fetch at native size, so an editing coordinate *is* a client coordinate.
  const url = '/capture.png?save=false&_=' + Date.now() + pq();
  const ok = await new Promise(res => { shot.onload = () => res(true); shot.onerror = () => res(false); shot.src = url; });
  if (!ok) {
    // A failed capture does not leave the screen blank — show the reason so it can be retried.
    let why = '';
    try {
      const r = await fetch('/capture.png?save=false' + pq());
      const b = await r.json().catch(() => ({}));
      why = b.error || ('HTTP ' + r.status);
    } catch (e) { why = String(e); }
    stagePanel('stage.capfail', escapeHtml(why));
    return;
  }
  showStage(true);
  fitView();

// If layout settles late, the canvas stays at its default size (300×150) and every
// coordinate is off — which is exactly what happened on first load. So this is not called
// once: it re-fits when the image loads, when the window resizes, and when the pane changes
// size.
// Set when the server says this profile's anchors cannot be found on the window in front of
// it. While it is set, the boxes are not drawn: they would be at saved coordinates over a real
// screenshot, which reads as authoritative and is not.
let anchorProblem = null;

function fitView() {
  if (!shot.naturalWidth) return;
  const avail = $('#stagewrap').clientWidth - 24;
  if (avail < 60) return;                       // layout has not settled — try again later
  lastFitWidth = avail;
  view = Math.min(1, avail / shot.naturalWidth);
  const w = Math.round(shot.naturalWidth * view), h = Math.round(shot.naturalHeight * view);
  shot.style.width = w + 'px';
  ov.width = w; ov.height = h;
  ov.style.width = w + 'px'; ov.style.height = h + 'px';
  paint();
}
// Keep retrying until layout settles. If the first fit happens over a zero-width layout,
// the canvas stays at its default size (300×150), and every rectangle drawn in that state
// is saved with wrong coordinates — the silent kind of wrong, so it has to be prevented.
// This uses a timer rather than `requestAnimationFrame`: rAF does not run at all while the
// page is hidden, so an editor opened in a background tab would stay at the default size
// forever. Timers still run on a hidden page, just more slowly.
function scheduleFit(tries = 40) {
  if (shot.naturalWidth && $('#stagewrap').clientWidth - 24 >= 60) { fitView(); return; }
  if (tries > 0) setTimeout(() => scheduleFit(tries - 1), 50);
}
addEventListener('resize', fitView);
addEventListener('visibilitychange', () => scheduleFit());
shot.addEventListener('load', () => scheduleFit());
new ResizeObserver(() => { if (!drag) fitView(); }).observe($('#stagewrap'));

// ── drawing ──────────────────────────────────────────────────────────
// What this thing IS. A region, a button, a button somebody marked as needing a human.
// Nothing about whether it can be reached right now - that is a different question and it gets
// its own answer, because a warning that overwrites the identity hides exactly what you want to
// know about the thing being warned over.
function colorOf(it) {
  if (it.kind === 'region') return COLOR.region;
  return it.confirm ? COLOR.danger : COLOR.target;
}

// Whether this rectangle's press point still lands on the window.
//
// False only when there is something to measure against: with no window found, or before the
// lookup returns, `client` is [0, 0] and every point on earth is outside it. Unknown is not a
// verdict, and treating it as one turned whole lists into warnings about nothing.

  if (!(client[0] > 0 && client[1] > 0)) return true;

function paint() {
  // If layout settled late and the canvas is stuck at the wrong size, fix it here.
  // **Never during a drag** — changing the scale mid-gesture makes the start and end points
  // read in different coordinate systems, producing a wrong rectangle (measured).
  const avail = $('#stagewrap').clientWidth - 24;
  if (!drag && avail >= 60 && Math.abs(avail - lastFitWidth) > 2) { fitView(); return; }
  ctx.clearRect(0, 0, ov.width, ov.height);

  // Anchors unresolved: the picture is of a real window, but these rectangles belong to a
  // different one. Drawing them here would put convincing boxes on the wrong keys.
  if (anchorProblem) return;

  // ── dim everything except the selection ──
  //
  // The old emphasis was 1px of border and a slightly denser fill. On a screen carrying
  // hundreds of rectangles from control detection, that difference is effectively
  // invisible. What is needed here is not "slightly different" but **know instantly which
  // one**, so everything else is covered and a hole is punched at the selection. It applies
  // the same way regardless of kind (button or region).
  if (sel >= 0 && items[sel]) {
    const [sx, sy, sw, sh] = items[sel].rect.map(v => v * view);
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0, 0, ov.width, ov.height);
    ctx.clearRect(sx, sy, sw, sh);   // the hole — the original screen shows through here
  }

  items.forEach((it, i) => {
    const on = i === sel;
    const c = colorOf(it), [x, y, w, h] = it.rect.map(v => v * view);
    ctx.lineWidth = on ? 3 : 2;
    ctx.strokeStyle = c;
    // The selection gets a **lighter** fill, not a heavier one — punching a hole and then
    // painting colour over it would hide the very control you have to press.
    if (reachable(it)) {
      ctx.fillStyle = c + (on ? '18' : '20');
      ctx.fillRect(x, y, w, h);
    }
    ctx.strokeRect(x, y, w, h);

    if (on) {
      // A white line inside and outside. Light UI or dark, one of the two always contrasts
      // (the same problem the crosshair already had, solved the same way).
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(x - 2.5, y - 2.5, w + 5, h + 5);
      ctx.strokeRect(x + 2.5, y + 2.5, Math.max(0, w - 5), Math.max(0, h - 5));
      // Corner brackets — on a small rectangle an outline alone does not register.
      const a = Math.max(6, Math.min(16, Math.min(w, h) / 3));
      ctx.lineWidth = 3; ctx.strokeStyle = c;
      ctx.beginPath();
      ctx.moveTo(x, y + a); ctx.lineTo(x, y); ctx.lineTo(x + a, y);
      ctx.moveTo(x + w - a, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + a);
      ctx.moveTo(x + w, y + h - a); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - a, y + h);
      ctx.moveTo(x + a, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - a);
      ctx.stroke();
    }

    const label = it.name + (it.confirm ? ' ⚠' : '');
    ctx.font = (on ? 'bold 13px' : '11px') + ' "Segoe UI", sans-serif';
    const tw = ctx.measureText(label).width, lh = on ? 18 : 14;
    const ly = y > lh + 1 ? y - lh : y + 2;
    ctx.fillStyle = c; ctx.fillRect(x, ly, tw + 8, lh);
    ctx.fillStyle = '#000'; ctx.fillText(label, x + 4, ly + lh - 4);

    if (it.kind === 'target') {                      // where the press actually lands
      const [px, py] = clickPoint(it).map(v => v * view);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; cross(px, py, 7);
      ctx.strokeStyle = COLOR.danger; ctx.lineWidth = 1; cross(px, py, 7);
    }
    if (on) { ctx.fillStyle = c; ctx.fillRect(x + w - 8, y + h - 8, 8, 8); }
  });
}
function cross(x, y, r) {
  ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
  ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
}

// ── mouse ────────────────────────────────────────────────────────────
// Mouse coordinates → client coordinates.
//
// The scale is **re-measured from the actual rendered size every time**, not taken from the
// cached `view`. If that cache is ever wrong (layout does sometimes settle late), every
// rectangle a person draws is quietly saved at the wrong coordinates — exactly the class of
// bug this tool exists to eliminate. Re-measuring here keeps the coordinates right even
// when the cache is not.
function at(e) {
  const r = ov.getBoundingClientRect();
  const sc = r.width / shot.naturalWidth || 1;
  return [Math.round((e.clientX - r.left) / sc), Math.round((e.clientY - r.top) / sc)];
}
function hit(x, y) {
  for (let i = items.length - 1; i >= 0; i--) {
    const [rx, ry, rw, rh] = items[i].rect;
    if (x >= rx && y >= ry && x < rx + rw && y < ry + rh) return i;
  }
  return -1;
}

ov.addEventListener('mousedown', e => {
  const [x, y] = at(e);
  if (mode) {
    items.push(mode === 'target'
      ? { kind: 'target', name: uniq('target'), rect: [x, y, 1, 1], click_button: 'left', note: '' }
      : { kind: 'region', name: uniq('region'), rect: [x, y, 1, 1] });

    drag = { type: 'resize', ox: x, oy: y };
    mode = null; $('#addTarget').classList.remove('on'); $('#addRegion').classList.remove('on');
    select(sel); return;
  }
  const i = hit(x, y);
  if (i < 0) { select(-1); return; }
  select(i);
  const [rx, ry, rw, rh] = items[i].rect;
  drag = (x >= rx + rw - 10 && y >= ry + rh - 10)
    ? { type: 'resize', ox: rx, oy: ry }
    : { type: 'move', dx: x - rx, dy: y - ry };

  if (!drag || sel < 0) return;
  const [x, y] = at(e), it = items[sel];
  if (drag.type === 'move') it.rect = [x - drag.dx, y - drag.dy, it.rect[2], it.rect[3]];
  else it.rect = [Math.min(drag.ox, x), Math.min(drag.oy, y),
                  Math.max(1, Math.abs(x - drag.ox)), Math.max(1, Math.abs(y - drag.oy))];
  syncForm(); paint();
});
addEventListener('mouseup', () => { drag = null; });

// Delete the selected item and **select the next one.** Control detection produces far more
// to discard than to keep (252 on the FANUC panel), so deleting happens in runs — making
// you re-select each time would make holding Delete impossible.
function deleteSelected() {
  if (sel < 0) return;
  const gone = items[sel].name;
  items.splice(sel, 1);
  select(items.length ? Math.min(sel, items.length - 1) : -1);
  // What was deleted is noted **quietly in the list header**. A modal would cover the
  // screen and block the next Delete every time — and deleting is done dozens of times in a
  // row, so that would be fatal. The variable is cleared immediately so the note disappears
  // on the next list render, with no timer involved.
  lastDeleted = gone;
  renderList();
  lastDeleted = '';
  paint();
  say('', '');   // close any standing message (never open a new one)
}

addEventListener('keydown', e => {
  // Hands off while the cursor is in a text field — an item vanishing because Delete was
  // pressed while editing its name is the worst thing that could come out of this.
  if (sel < 0 || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === 'Delete') { e.preventDefault(); deleteSelected(); return; }
  const step = e.shiftKey ? 10 : 1;
  const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (!d) return;
  e.preventDefault();
  items[sel].rect[0] += d[0]; items[sel].rect[1] += d[1];
  syncForm(); paint();
});

// ── list / form ──────────────────────────────────────────────────────
// Sequence numbers are **padded to four digits** (ctrl_0001, ctrl_0100).
//
// The list is ordered by name (the server holds it in a BTreeMap, so saving freezes that
// order), and with ragged digit counts the alphabetical order tangles into
// ctrl_199 → ctrl_2 → ctrl_20 → ctrl_200. Control detection creates hundreds at a time, so
// that tangle becomes the entire list.
function uniq(base) {
  let n = 1, name;
  do { name = base + '_' + String(n++).padStart(4, '0'); } while (items.some(i => i.name === name));
  return name;
}
function renderList() {
  const ul = $('#list'); ul.innerHTML = '';
  const targets = items.filter(x => x.kind === 'target').length;
  const regions = items.length - targets;
  $('#listcount').textContent =
    `${tn('count.buttons', targets)} · ${tn('count.regions', regions)}` +
    (lastDeleted ? t('ok.deleted', lastDeleted) : '');
  items.forEach((it, i) => {
    const li = document.createElement('li');
    if (i === sel) li.className = 'sel';
    const c = colorOf(it);
    // Hollow = the press point is off the window. Keeping the colour keeps the answer to
    // "what is this", which is the half a single magenta swatch used to throw away.
    const fill = reachable(it) ? `background:${c}` : `border:2px solid ${c}`;
    li.innerHTML = `<span class="swatch" style="${fill}"></span>` +
      `<span class="nm">${escapeHtml(it.name)}</span>` +
      `<span class="xy">${it.rect.join(',')}</span>`;
    li.onclick = () => select(i);
    ul.appendChild(li);
  });
}
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// A copy of the server's window-matching rule — substring or exact on the title, exact on
// the class. It is counted here in advance because two or more matches make the server
// **refuse rather than pick one**. Better to know while choosing than after saving.
function matchesSpec(w, spec) {
  const t = (w.title || '').toLowerCase();
  const needle = (spec.title || '').trim().toLowerCase();
  const cls = (spec.class || '').trim().toLowerCase();
  const titleOk = !needle || (spec.title_exact ? t === needle : t.includes(needle));
  const classOk = !cls || (w.class || '').toLowerCase() === cls;
  return titleOk && classOk;
}

function renderWindowPicker() {
  const sel = $('#winpick');
  sel.innerHTML = `<option value="">${escapeHtml(t('winpick.ph'))}</option>` +
    windowList.map((w, i) =>
      `<option value="${i}">${escapeHtml(w.title)}  [${escapeHtml(w.class)}]  ${w.client[0]}×${w.client[1]}</option>`
    ).join('');
}

function renderWindowMatch() {
  const spec = (doc && doc.window) || {};
  $('#w_title').value = spec.title || '';
  $('#w_class').value = spec.class || '';
  $('#w_exact').checked = !!spec.title_exact;
  const hits = windowList.filter(w => matchesSpec(w, spec));
  const el = $('#winmatch');
  if (!spec.title && !spec.class) {
    el.textContent = t('match.need');
    el.style.color = '#ff3c3c';
  } else if (hits.length === 0) {
    el.textContent = t('match.none');
    el.style.color = '#ff3c3c';
  } else if (hits.length === 1) {
    el.textContent = t('match.one', hits[0].title);
    el.style.color = '';
  } else {
    el.textContent = t('match.many', hits.length);
    el.style.color = '#ff8200';
  }
  if (windowChanged) {
    el.textContent += t('match.unsaved');
  }
}

function bindWindowFields() {
  const push = () => {
    if (!doc) return;
    doc.description = $('#p_desc').value;
    doc.window = {
      title: $('#w_title').value,
      title_exact: $('#w_exact').checked,
      class: $('#w_class').value,
    };
    windowChanged = true;
    renderWindowMatch();
    scheduleWindowPreview();
  };
  ['p_desc', 'w_title', 'w_class', 'w_exact'].forEach(id => {
    const el = $('#' + id);
    el.oninput = push;
    el.onchange = push;
  });
  $('#winpick').onchange = () => {
    const i = $('#winpick').value;
    if (i === '' || !doc) return;
    const w = windowList[+i];
    // Leave the title as a substring match and fill in the class alongside it — plenty of
    // applications append the open file name, so an exact match stops finding the window
    // the moment a document is opened.
    doc.window = { title: w.title, title_exact: false, class: w.class };
    windowChanged = true;
    renderWindowMatch();
    clearTimeout(winPreviewTimer);
    applyWindowChoice(w).then(() => {
      if (!items.length) say(t('ok.switched', w.title), 'ok');
    });
  };
}

// The admin code box says why it is needed and whether it is empty, before you try to save.
// The value never comes from the server — only the boolean "is one required".
function renderAdminHint() {
  const box = $('#code');
  if (!adminRequired) {
    box.placeholder = t('code.ph.no');
    box.style.borderColor = '';
    box.title = t('code.t.no');
    return;
  }
  box.placeholder = t('code.ph.yes');
  box.title = t('code.t.yes');
  box.style.borderColor = box.value ? '' : '#ff8200';
}

function renderProfiles(def) {
  const sel = $('#profpick');
  sel.innerHTML = profiles.map(n =>
    `<option value="${n}"${n === profile ? ' selected' : ''}>${escapeHtml(n)}${n === def ? escapeHtml(t('profpick.default')) : ''}</option>`
  ).join('');
  sel.style.display = '';
}

// Switching profile **reloads everything.** The window, the coordinate system and the
// buttons are an entirely different world, so carrying over even one thing on screen would
// make it a coordinate belonging to the wrong window.
//
// A new profile = registering one more window with this tool. The file
// profiles/deescreen.<name>.json appears and the server adds it to the list on the spot —
// no config edit, no restart.
async function newProfile() {
  const name = (prompt(t('prompt.newname')) || '').trim();
  if (!name) return;
  if (!/^[A-Za-z0-9_-]+$/.test(name)) {
    say(t('err.badname'), 'err');
    return;
  }
  if (profiles.includes(name)) { say(t('err.nameexists', name), 'err'); return; }
  if (adminRequired && !$('#code').value) {
    say(t('err.needcode.new'), 'err');
    return;
  }
  // An empty window spec fails server validation (an empty rule matches every window), so
  // something has to go in. This used to seed the first open window, which meant **the wrong
  // program's screen** appeared right after creation and you drew rectangles on it. Seeding
  // the profile name as an exact match matches nothing, so the screen stays black until you
  // pick.
  const seed = {
    description: '',
    window: { title: name, title_exact: true, class: '' },
    reference_client: null, on_size_mismatch: 'reject',
    regions: {}, buttons: {}, keys: {}
  };
  try {
    const res = await fetch('/admin/profile?profile=' + encodeURIComponent(name), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Code': $('#code').value },
      body: JSON.stringify(seed)
    });
    const b = await res.json().catch(() => ({}));
    if (!res.ok) { say(t('err.createfail', res.status, b.error || ''), 'err'); return; }
    await switchProfile(name);
    say(t('ok.created', name), 'ok');
  } catch (e) { say(t('err.createfail2', e), 'err'); }
}

async function switchProfile(name) {
  profile = name;
  const u = new URL(location.href);
  u.searchParams.set('profile', name);
  history.replaceState(null, '', u);   // so a refresh comes back to the same profile
  items = []; sel = -1; doc = null;
  await loadAll();
  scheduleFit();
}

// Showing the reference size. Without a way to fix `reference_client` from the editor,
// freshly drawn coordinates get saved against a stale reference and are refused from the
// moment you save.
function renderRef() {
  const r = doc && doc.reference_client;
  const cur = `${client[0]}×${client[1]}`;
  const el = $('#refmeta');
  if (!r) { el.textContent = t('refmeta.none', cur); el.style.color = ''; return; }
  const same = r[0] === client[0] && r[1] === client[1];
  el.textContent = `${r[0]}×${r[1]}` + (same ? t('refmeta.same') : t('refmeta.diff', cur));
  el.style.color = same ? '' : '#ff8200';
}

function select(i) {
  sel = i;
  $('#del').disabled = i < 0;
  // A class rather than hidden — the space stays, it only dims.
  $('#form').classList.toggle('empty', i < 0);
  $('#selhint').textContent = i < 0 ? t('selhint.none')
                                    : t(items[i].kind === 'target' ? 'selhint.button' : 'selhint.region');
  const isTarget = i >= 0 && items[i].kind === 'target';
  $('#targetOnly').classList.toggle('off', !isTarget);
  $('#noteRow').classList.toggle('off', !isTarget);
  if (i >= 0) { $('#f_kind').value = items[i].kind; syncForm(); }
  renderList(); paint();
}
function syncForm() {
  const it = items[sel]; if (!it) return;
  $('#f_name').value = it.name;
  [$('#f_x').value, $('#f_y').value, $('#f_w').value, $('#f_h').value] = it.rect;
  if (it.kind !== 'target') return;
  $('#f_button').value = it.click_button || 'left';
  $('#f_double').checked = !!it.double;
  $('#f_confirm').checked = !!it.confirm;
  $('#f_settle').value = it.settle_ms ?? '';
  $('#f_note').value = it.note || '';
}
// Button ↔ region conversion. Control detection brings everything in as buttons, and some
// of them are places to *look at* rather than press (a status bar, a position readout).
// Change the kind instead of making anyone redraw it.
function changeKind(to) {
  const it = items[sel];
  if (!it || it.kind === to) return;

  if (to === 'region') {
    // A region is nothing but a rectangle — the button-only fields would not be saved, so
    // drop them here where it can be said out loud.
    const dropped = [];
    if (it.confirm) dropped.push(t('drop.confirm'));
    if (it.settle_ms != null && it.settle_ms !== '') dropped.push(t('drop.settle'));
    if (it.note) dropped.push(t('drop.note'));
    ['point', 'click_button', 'double', 'confirm', 'settle_ms', 'note']
      .forEach(k => delete it[k]);
    it.kind = 'region';
    if (dropped.length) {
      say(t('ok.toregion', dropped.join(' · ')), 'ok');
    }
  } else {
    it.kind = 'target';
    it.click_button = it.click_button || 'left';
    it.note = it.note || '';
  }
  select(sel);
  renderList();
  paint();
}

function bindForm() {
  const push = () => {
    const it = items[sel]; if (!it) return;
    it.name = $('#f_name').value.trim() || it.name;
    it.rect = [+$('#f_x').value, +$('#f_y').value, Math.max(1, +$('#f_w').value), Math.max(1, +$('#f_h').value)];
    if (it.kind === 'target') {
      it.click_button = $('#f_button').value;
      it.double = $('#f_double').checked;
      it.confirm = $('#f_confirm').checked;
      it.settle_ms = $('#f_settle').value === '' ? null : +$('#f_settle').value;
      it.note = $('#f_note').value;
    }
    renderList(); paint();
  };
  ['f_name','f_x','f_y','f_w','f_h','f_button','f_double','f_confirm','f_settle','f_note']
    .forEach(id => { const el = $('#' + id); el.oninput = push; el.onchange = push; });
}

// ── actions ──────────────────────────────────────────────────────────
$('#addTarget').onclick = () => { mode = 'target'; $('#addTarget').classList.add('on'); $('#addRegion').classList.remove('on'); };
$('#addRegion').onclick = () => { mode = 'region'; $('#addRegion').classList.add('on'); $('#addTarget').classList.remove('on'); };
$('#delall').onclick = () => {
  if (!items.length) return;
  // Control detection usually creates far more to discard than to keep — removing them one
  // at a time is torture.
  if (!confirm(tn('confirm.delall', items.length))) return;
  items = []; select(-1); renderList(); paint();
  say(t('ok.cleared'), 'ok');
};
$('#del').onclick = deleteSelected;
$('#refresh').onclick = () => refreshShot().then(() => say('', ''));
$('#restore').onclick = restoreWindow;
$('#profpick').onchange = () => switchProfile($('#profpick').value);
$('#newprof').onclick = newProfile;

// Removing a profile is not the same act as removing a button, so it does not get the same
// treatment. A button comes back by drawing it again; a profile is a window, its reference
// size and every rectangle in it, and from here it cannot be brought back at all — only a
// person on that PC can, out of the file the server sets aside. So this one asks, and says
// what is about to be lost as a number rather than as a name.
$('#delprof').onclick = async () => {
  if (!profile) return;
  if (adminRequired && !$('#code').value) { say(t('err.needcode.save'), 'err'); return; }
  const targets = items.filter(i => i.kind === 'target').length;
  const regions = items.length - targets;
  if (!confirm(t('confirm.delprofile', profile,
                 tn('count.buttons', targets), tn('count.regions', regions)))) return;
  try {
    const res = await fetch('/admin/profile?confirm=true' + pq(), {
      method: 'DELETE',
      headers: { 'X-Admin-Code': $('#code').value }
    });
    const b = await res.json().catch(() => ({}));
    // The server refuses to delete the profile config.json names as the default, because
    // undoing that needs a config edit and a restart. Show its sentence rather than
    // keeping a second copy of the rule here.
    if (!res.ok) { say(t('err.delprofile', res.status, b.error || ''), 'err'); return; }
    say(t('ok.delprofile', profile, b.archived || ''), 'ok');
    profile = '';
    const u = new URL(location.href);
    u.searchParams.delete('profile');
    history.replaceState(null, '', u);
    await loadAll();
  } catch (e) { say(t('err.delprofile', '', e), 'err'); }
};

// Rename moves the file. Saving under a new name would COPY it, leaving two profiles aimed
// at one window — at which point omitting ?profile= stops working for everyone. That is why
// this is its own endpoint and not something the save button can express.
$('#renprof').onclick = async () => {
  if (!profile) return;
  const to = (prompt(t('prompt.rename', profile), profile) || '').trim();
  if (!to || to === profile) return;
  if (!/^[A-Za-z0-9_-]+$/.test(to)) { say(t('err.badname'), 'err'); return; }
  if (profiles.includes(to)) { say(t('err.nameexists', to), 'err'); return; }
  if (adminRequired && !$('#code').value) { say(t('err.needcode.save'), 'err'); return; }
  try {
    const res = await fetch('/admin/profile/rename?to=' + encodeURIComponent(to) + pq(), {
      method: 'POST',
      headers: { 'X-Admin-Code': $('#code').value }
    });
    const b = await res.json().catch(() => ({}));
    if (!res.ok) { say(t('err.renprofile', res.status, b.error || ''), 'err'); return; }
    say(t('ok.renprofile', profile, to), 'ok');
    await switchProfile(to);
  } catch (e) { say(t('err.renprofile', '', e), 'err'); }
};
$('#setref').onclick = () => {
  if (!client[0] || !client[1]) { say(t('err.nosize'), 'err'); return; }
  doc.reference_client = [client[0], client[1]];
  renderRef();
  say(t('ok.refset', client[0], client[1]), 'ok');
};

$('#detect').onclick = async () => {
  try {
    const r = await (await fetch('/controls?x=1' + pq())).json();
    if (!r.count) { say(r.note, 'err'); return; }
    let added = 0, skipped = 0;
    const area = client[0] * client[1];
    for (const c of r.controls) {
      if (!c.visible || c.rect[2] < 6 || c.rect[3] < 6) { skipped++; continue; }
      // Anything covering more than 40% of the screen is a panel or container, not a
      // button. WinForms makes those windows too, so taking them all fills the list with
      // rubbish.
      if (area && c.rect[2] * c.rect[3] > area * 0.4) { skipped++; continue; }
      const label = (c.text || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
      // With no caption, do not fall back to the class name — a list of
      // windowsforms10_window_8_app_0_378734a_242 tells them apart from nothing. A short
      // sequence number is better.
      items.push({ kind: 'target', name: uniq(label || 'ctrl'), rect: c.rect, click_button: 'left',
                   note: t('note.detected', c.class, c.text ? ' · ' + c.text : t('note.nocaption')) });
      added++;
    }
    renderList(); paint();
    say(t('ok.detected', added, skipped), 'ok');
  } catch (e) { say(t('err.detect', e), 'err'); }
};

$('#export').onclick = () => {
  const blob = new Blob([JSON.stringify(toDocFromItems(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `deescreen.${profile}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  say(t('ok.exported'), 'ok');
};

// The admin code lives in **session storage** — it disappears when the tab closes and never
// touches disk. In localStorage it would outlive the session for whoever uses that PC next,
// and this code is the key to rewriting *what can be pressed*, so there is no reason to keep
// it alive that long.
const CODE_KEY = 'deescreen.adminCode';
$('#code').value = sessionStorage.getItem(CODE_KEY) || '';
$('#code').oninput = renderAdminHint;

$('#save').onclick = async () => {
  // Catch it before the round trip — an empty box against a server that demands a code is
  // a guaranteed 401.
  if (adminRequired && !$('#code').value) {
    renderAdminHint();
    say(t('err.needcode.save'), 'err');
    return;
  }

  const d = toDocFromItems();
  const risky = Object.entries(d.buttons).filter(([, t]) => t.confirm).map(([n]) => n);
  const msg = t('confirm.save',
                tn('count.buttons', Object.keys(d.buttons).length),
                tn('count.regions', Object.keys(d.regions).length)) +
    (risky.length ? t('confirm.save.risky', risky.join(', ')) : t('confirm.save.none'));
  if (!confirm(msg)) return;
  try {
    // The server refuses a save that takes a confirm flag off a button unless the request
    // says so. Here the caller is a person who just unticked the box, so the answer is to
    // ask them by name and pass that on - not to send the acknowledgement every time. The
    // diff lives on the server; retrying on its refusal keeps one copy of that rule.
    const send = (ack) => fetch('/admin/profile?x=1' + pq() + (ack ? '&confirm=true' : ''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Code': $('#code').value },
      body: JSON.stringify(d)
    });
    let res = await send(false);
    let body = await res.json();
    if (res.status === 403 && body.detail && body.detail.buttons) {
      if (!confirm(t('confirm.unprotect', body.detail.buttons.join(', ')))) {
        say(t('ok.unprotect.no'), 'ok');
        return;
      }
      res = await send(true);
      body = await res.json();
    }
    if (!res.ok) {
      // Do not remember a wrong code — leaving it in place makes every later save fail for
      // a reason that is now hard to see.
      if (res.status === 401) {
        sessionStorage.removeItem(CODE_KEY);
        renderAdminHint();
        say(t('err.badcode'), 'err');
        return;
      }
      say(t('err.savefail', res.status, JSON.stringify(body, null, 2)), 'err');
      return;
    }
    sessionStorage.setItem(CODE_KEY, $('#code').value);
    say(t('ok.saved', body.backup), 'ok');
    doc = d;
    if (windowChanged) { windowChanged = false; await loadAll(); }
  } catch (e) { say(t('err.savefail2', e), 'err'); }
};

$('#testClick').onclick = async () => {
  const it = items[sel]; if (!it || it.kind !== 'target') return;
  try {
    const res = await fetch('/click', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profile, button: it.name, confirm: !!it.confirm, settle_ms: 400 })
    });
    const b = await res.json();
    if (!res.ok) { say(t('err.clickfail', res.status, JSON.stringify(b, null, 2)), 'err'); return; }
    say(t('ok.clicked'), 'ok');
    await refreshShot();
  } catch (e) { say(t('err.clickfail2', e), 'err'); }
};

$('#f_kind').onchange = () => changeKind($('#f_kind').value);
$('#modalclose').onclick = closeMsg;
$('#modal').onclick = e => { if (e.target.id === 'modal') closeMsg(); };
addEventListener('keydown', e => { if (e.key === 'Escape') closeMsg(); });

for (const b of document.querySelectorAll('#lang button')) {
  b.onclick = () => setLang(b.dataset.lang);
}

bindForm();
bindWindowFields();
// Static text first, so nothing shows in the wrong language even for the moment before the
// first response arrives.
applyLang();
loadAll().then(() => scheduleFit());
</script>
